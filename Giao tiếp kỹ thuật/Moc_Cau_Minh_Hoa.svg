<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 -80 180 220" width="100%" height="500" style="background:#1e1e1e; font-family:sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4fc3f7"/>
    </marker>
  </defs>

  <!-- Trục tâm (Centerlines) -->
  <line x1="0" y1="-60" x2="0" y2="130" stroke="#e57373" stroke-dasharray="6,3,1,3" stroke-width="0.8"/>
  <line x1="-60" y1="0" x2="70" y2="0" stroke="#e57373" stroke-dasharray="6,3,1,3" stroke-width="0.8"/>
  <line x1="-40" y1="40" x2="50" y2="-50" stroke="#e57373" stroke-dasharray="6,3,1,3" stroke-width="0.8"/>

  <!-- Phần Chuôi Móc (Shank) Y hướng lên, SVG Y hướng xuống nên invert -->
  <g transform="scale(1, -1)">
    <!-- Thân trụ phi 20 và vát mép -->
    <path d="
      M -8 110 L 8 110
      L 10 108 L 10 83
      L 8.5 83 L 8.5 80 L 10 80
      L 10 62
      A 2 2 0 0 0 12.5 60
      L 12.5 52
      L -12.5 52
      L -12.5 60
      A 2 2 0 0 0 -10 62
      L -10 80
      L -8.5 80 L -8.5 83 L -10 83
      L -10 108 Z
    " fill="none" stroke="#81c784" stroke-width="2" stroke-linejoin="round"/>

    <!-- Lỗ tròn phi 40 -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- Cung đáy R50 -->
    <path d="M 0 -20 A 20 20 0 0 0 20 0 A 36 36 0 0 1 56 0 A 50 50 0 0 1 0 -50 A 50 50 0 0 1 -42 -20" fill="none" stroke="#ffb74d" stroke-width="2"/>
  </g>

  <!-- Kích thước chú thích -->
  <text x="0" y="-115" fill="#4fc3f7" font-size="8" text-anchor="middle">Phi 20 (Vát 2x45°)</text>
  <text x="20" y="-75" fill="#4fc3f7" font-size="7">Rãnh Phi 17 x 3</text>
  <text x="20" y="-52" fill="#4fc3f7" font-size="7">Vai Phi 25 (R2)</text>
  <text x="0" y="5" fill="#fff" font-size="8" text-anchor="middle">O(0,0) Phi 40</text>
  <text x="40" y="70" fill="#ffb74d" font-size="8">R50</text>
  <text x="-50" y="120" fill="#aed581" font-size="9" font-weight="bold">BẢN VẼ MÓC CẨU (LASTENHAKEN)</text>
</svg>